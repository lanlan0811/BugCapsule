{% if error %}
<div class="notice notice-error" role="alert"><svg class="icon" aria-hidden="true"><use href="#icon-cross"></use></svg><div><strong>演示操作失败</strong><p>{{ error }}</p></div></div>
{% elif reset %}
<div class="notice notice-info" role="status"><svg class="icon" aria-hidden="true"><use href="#icon-check"></use></svg><div><strong>演示已重置</strong><p>泄漏 Session 已释放，连接池恢复为 ready。</p></div></div>
{% elif result %}
<div class="notice notice-error" role="status"><svg class="icon" aria-hidden="true"><use href="#icon-warning"></use></svg><div><strong>故障复现成功</strong><p><code>HTTP {{ result.first_status }} → {{ result.second_status }} → {{ result.exhausted_status }}</code>；<code>{{ result.fault }}</code></p></div></div>
{% endif %}
