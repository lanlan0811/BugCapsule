[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bugcapsule"
version = "0.1.0"
description = "以运行时证据为核心、能够验证修复结果的 AI 调试工具"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "BugCapsule Contributors" },
]
keywords = ["debugging", "observability", "opentelemetry", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "opentelemetry-api>=1.40,<2",
  "opentelemetry-instrumentation-fastapi>=0.61b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.61b0,<1",
  "opentelemetry-sdk>=1.40,<2",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
bugcapsule = "bugcapsule.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
supply-chain = [
  "cyclonedx-bom==7.3.1",
  "pip-audit==2.10.1",
]
artifacts = [
  "pdfplumber==0.11.9",
  "pypdf==6.10.0",
  "reportlab==4.4.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bugcapsule"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=bugcapsule --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bugcapsule"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PTH", "RUF"]
allowed-confusables = ["：", "，", "；"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true
