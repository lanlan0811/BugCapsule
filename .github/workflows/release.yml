name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    uses: ./.github/workflows/ci.yml

  publish-github-mirror:
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      UV_VERSION: "0.8.13"
      SUPPLY_CHAIN_DIR: supply-chain
      PYTHONUTF8: "1"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import pathlib,re; text=pathlib.Path("pyproject.toml").read_text(); print(re.search(r"(?m)^version = \"([^\"]+)\"$", text).group(1))')"
          test "$RELEASE_TAG" = "v$version"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"

      - name: Install locked production dependencies
        run: uv sync --frozen --no-dev

      - name: Build wheel and source archive
        run: uv build

      - name: Prepare supply-chain evidence directory
        run: mkdir --parents "$SUPPLY_CHAIN_DIR"

      - name: Export hash-locked production requirements
        shell: bash
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$SUPPLY_CHAIN_DIR/release-requirements.txt" \
            >/dev/null

      - name: Audit known dependency vulnerabilities
        shell: bash
        run: |
          uv run --isolated --frozen --no-dev --group supply-chain pip-audit \
            --require-hashes \
            --requirement "$SUPPLY_CHAIN_DIR/release-requirements.txt" \
            --format json \
            --output "$SUPPLY_CHAIN_DIR/dependency-audit.json" \
            --progress-spinner off

      - name: Generate CycloneDX 1.6 SBOM
        shell: bash
        run: |
          uv run --isolated --frozen --no-dev --group supply-chain cyclonedx-py environment \
            --pyproject pyproject.toml \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "$SUPPLY_CHAIN_DIR/bugcapsule.cdx.json" \
            .venv

      - name: Validate bundle and write SHA-256 manifest
        shell: bash
        run: |
          .venv/bin/python -m scripts.release_integrity \
            --dist-dir dist \
            --sbom "$SUPPLY_CHAIN_DIR/bugcapsule.cdx.json" \
            --audit "$SUPPLY_CHAIN_DIR/dependency-audit.json" \
            --requirements "$SUPPLY_CHAIN_DIR/release-requirements.txt" \
            --checksums "$SUPPLY_CHAIN_DIR/SHA256SUMS"

      - name: Publish GitHub mirror release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            dist/* \
            "$SUPPLY_CHAIN_DIR"/* \
            --verify-tag \
            --title "BugCapsule $RELEASE_TAG" \
            --generate-notes
