name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==0.8.13"

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  demo-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure demo environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and order service
        run: docker compose up --build --detach --wait

      - name: Verify deterministic pool exhaustion
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          for attempt in 1 2; do
            code="$(curl --silent --output "leak-${attempt}.json" --write-out '%{http_code}' --request POST http://127.0.0.1:8766/demo/leak)"
            test "$code" = "500"
          done
          code="$(curl --silent --output exhausted.json --write-out '%{http_code}' --request POST http://127.0.0.1:8766/demo/leak)"
          test "$code" = "503"
          grep --fixed-strings 'database_pool_exhausted' exhausted.json
          curl --fail --silent --request POST http://127.0.0.1:8766/demo/reset
