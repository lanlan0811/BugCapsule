name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

env:
  UV_VERSION: "0.8.13"
  SUPPLY_CHAIN_DIR: supply-chain
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  demo-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure demo environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build isolated verifier image
        run: docker build --file Dockerfile.verify --tag bugcapsule-verifier:0.1.0 .

      - name: Verify restricted regression is stable for 20 before/after runs
        shell: bash
        run: |
          set -euo pipefail
          after_dir="$(mktemp -d)"
          trap 'rm -rf -- "$after_dir"' EXIT
          git archive HEAD | tar -x -C "$after_dir"
          git -C "$after_dir" apply verification_tests/fixtures/connection-release.diff
          chmod 0755 "$after_dir"

          run_regression() {
            local source_dir="$1"
            local expectation="$2"
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --pids-limit 128 \
              --memory 512m \
              --cpus 1 \
              --user 10001:10001 \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
              --mount "type=bind,source=${source_dir},target=/workspace,readonly" \
              --workdir /workspace \
              --env PYTHONPATH=/workspace/src \
              --env EXPECTATION="$expectation" \
              bugcapsule-verifier:0.1.0 \
              /bin/sh -c '
                set -eu
                outcomes=0
                for attempt in $(seq 1 20); do
                  if /app/.venv/bin/python -m pytest verification_tests/test_connection_release.py -q -p no:cacheprovider -o addopts=; then
                    test "$EXPECTATION" = pass || exit 1
                    outcomes=$((outcomes + 1))
                  else
                    test "$EXPECTATION" = fail || exit 1
                    outcomes=$((outcomes + 1))
                  fi
                done
                test "$outcomes" -eq 20
              '
          }

          run_regression "$GITHUB_WORKSPACE" fail
          run_regression "$after_dir" pass

      - name: Start PostgreSQL and order service
        shell: bash
        run: |
          if ! docker compose up --build --detach --wait; then
            docker compose ps --all
            docker compose logs --no-color order-service
            docker compose down --volumes
            exit 1
          fi

      - name: Verify deterministic pool exhaustion
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT
          for attempt in 1 2; do
            code="$(curl --silent --output "leak-${attempt}.json" --write-out '%{http_code}' --request POST http://127.0.0.1:8766/demo/leak)"
            test "$code" = "500"
          done
          code="$(curl --silent --output exhausted.json --write-out '%{http_code}' --request POST http://127.0.0.1:8766/demo/leak)"
          test "$code" = "503"
          grep --fixed-strings 'database_pool_exhausted' exhausted.json
          curl --fail --silent --request POST http://127.0.0.1:8766/demo/reset

  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Install locked production dependencies
        run: uv sync --frozen --no-dev

      - name: Build wheel and source archive
        run: uv build

      - name: Prepare supply-chain evidence directory
        run: mkdir --parents "$SUPPLY_CHAIN_DIR"

      - name: Export hash-locked production requirements
        shell: bash
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements.txt \
            --output-file "$SUPPLY_CHAIN_DIR/release-requirements.txt" \
            >/dev/null

      - name: Audit known dependency vulnerabilities
        shell: bash
        run: |
          uv run --isolated --frozen --no-dev --group supply-chain pip-audit \
            --require-hashes \
            --requirement "$SUPPLY_CHAIN_DIR/release-requirements.txt" \
            --format json \
            --output "$SUPPLY_CHAIN_DIR/dependency-audit.json" \
            --progress-spinner off

      - name: Generate CycloneDX 1.6 SBOM
        shell: bash
        run: |
          uv run --isolated --frozen --no-dev --group supply-chain cyclonedx-py environment \
            --pyproject pyproject.toml \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "$SUPPLY_CHAIN_DIR/bugcapsule.cdx.json" \
            .venv

      - name: Validate bundle and write SHA-256 manifest
        shell: bash
        run: |
          .venv/bin/python -m scripts.release_integrity \
            --dist-dir dist \
            --sbom "$SUPPLY_CHAIN_DIR/bugcapsule.cdx.json" \
            --audit "$SUPPLY_CHAIN_DIR/dependency-audit.json" \
            --requirements "$SUPPLY_CHAIN_DIR/release-requirements.txt" \
            --checksums "$SUPPLY_CHAIN_DIR/SHA256SUMS"

      - name: Upload supply-chain bundle
        uses: actions/upload-artifact@v4
        with:
          name: bugcapsule-supply-chain-${{ github.sha }}
          path: |
            dist/*
            ${{ env.SUPPLY_CHAIN_DIR }}/*
          if-no-files-found: error
          retention-days: 14
