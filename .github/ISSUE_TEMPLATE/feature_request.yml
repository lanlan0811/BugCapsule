name: Feature request
description: Propose a scoped improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user impact
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and evidence boundary
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
