name: Bug report
description: Report a reproducible BugCapsule defect without sensitive data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach production capsules, credentials, personal data, or private source code."
  - type: input
    id: version
    attributes:
      label: BugCapsule version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Python, and Docker versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted `bugcapsule doctor` output
      description: Review the output before posting; never include `.env`.
