<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">BugCapsule evidence-bound debugging workflow</title>
  <desc id="desc">A Mermaid-style flowchart from fault injection through evidence capture, evidence-bound patching, explicit approval, isolated verification, and an offline HTML report.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#2a52a0"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#f6f7f9"/>
  <rect x="20" y="20" width="1160" height="420" rx="8" fill="#ffffff" stroke="#d8dce3"/>
  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
    <text x="52" y="62" font-size="24" font-weight="600" fill="#15181e">从故障事实到验证结果</text>
    <text x="1148" y="61" text-anchor="end" font-family="Consolas, SFMono-Regular, monospace" font-size="14" fill="#6b7280">EVIDENCE-BOUND DEBUGGING FLOW</text>
  </g>
  <path d="M52 82H1148" stroke="#d8dce3"/>
  <g fill="none" stroke="#2a52a0" stroke-width="3" marker-end="url(#arrow)">
    <path d="M286 224H326"/><path d="M576 224H616"/><path d="M866 224H906"/>
  </g>
  <g font-family="Consolas, SFMono-Regular, monospace" font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="306" y="208">CAPTURE</text><text x="596" y="208">ANALYZE</text><text x="886" y="208">APPROVE</text>
  </g>
  <g transform="translate(42 116)">
    <rect width="244" height="216" rx="8" fill="#ffffff" stroke="#9e2424" stroke-width="2"/><rect width="244" height="46" rx="8" fill="#fbecec"/><path d="M0 46H244" stroke="#e3aaaa"/>
    <circle cx="25" cy="23" r="12" fill="#9e2424"/><path d="M25 15V25M25 30V31" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"><text x="47" y="30" font-size="20" font-weight="600" fill="#5f1717">01 故障注入</text><text x="22" y="82" font-size="15" fill="#6b7280">FastAPI + PostgreSQL</text></g>
    <text x="22" y="118" font-family="Consolas, SFMono-Regular, monospace" font-size="20" font-weight="600" fill="#15181e">500 → 500 → 503</text>
    <rect x="22" y="139" width="200" height="34" rx="4" fill="#f6f7f9" stroke="#d8dce3"/><text x="122" y="161" text-anchor="middle" font-family="Consolas, SFMono-Regular, monospace" font-size="13" fill="#9e2424">database_pool_exhausted</text>
    <text x="22" y="196" font-family="Consolas, SFMono-Regular, monospace" font-size="12" fill="#6b7280">RUNTIME FAILURE</text>
  </g>
  <g transform="translate(332 116)">
    <rect width="244" height="216" rx="8" fill="#ffffff" stroke="#2a52a0" stroke-width="2"/><rect width="244" height="46" rx="8" fill="#eef4fb"/><path d="M0 46H244" stroke="#abc2df"/>
    <path d="M20 15H34V31H20ZM24 11V15M30 11V15" fill="none" stroke="#2a52a0" stroke-width="2"/>
    <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"><text x="47" y="30" font-size="20" font-weight="600" fill="#21417f">02 证据胶囊</text><text x="22" y="82" font-size="15" fill="#6b7280">运行时证据确定性归档</text></g>
    <g font-family="Consolas, SFMono-Regular, monospace" font-size="14" text-anchor="middle">
      <rect x="22" y="101" width="91" height="30" rx="4" fill="#f6f7f9" stroke="#d8dce3"/><text x="67" y="121" fill="#15181e">TRACE</text><rect x="131" y="101" width="91" height="30" rx="4" fill="#f6f7f9" stroke="#d8dce3"/><text x="176" y="121" fill="#15181e">LOG</text>
      <rect x="22" y="143" width="91" height="30" rx="4" fill="#f6f7f9" stroke="#d8dce3"/><text x="67" y="163" fill="#15181e">SOURCE</text><rect x="131" y="143" width="91" height="30" rx="4" fill="#f6f7f9" stroke="#d8dce3"/><text x="176" y="163" fill="#15181e">GIT</text>
      <text x="22" y="198" text-anchor="start" font-size="13" font-weight="600" fill="#2a52a0">.bugcapsule · Evidence ID</text>
    </g>
  </g>
  <g transform="translate(622 116)">
    <rect width="244" height="216" rx="8" fill="#ffffff" stroke="#2a52a0" stroke-width="2"/><rect width="244" height="46" rx="8" fill="#eef4fb"/><path d="M0 46H244" stroke="#abc2df"/>
    <path d="M19 28L26 21L33 27L39 17" fill="none" stroke="#2a52a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#2a52a0"><circle cx="19" cy="28" r="2.5"/><circle cx="26" cy="21" r="2.5"/><circle cx="33" cy="27" r="2.5"/><circle cx="39" cy="17" r="2.5"/></g>
    <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"><text x="52" y="30" font-size="20" font-weight="600" fill="#21417f">03 证据约束修复</text><text x="22" y="82" font-size="15" fill="#6b7280">根因与 Patch 必须引用证据</text></g>
    <rect x="22" y="102" width="200" height="36" rx="4" fill="#f6f7f9" stroke="#d8dce3"/><text x="122" y="125" text-anchor="middle" font-family="Consolas, SFMono-Regular, monospace" font-size="14" fill="#15181e">ROOT CAUSE + EVIDENCE</text>
    <path d="M122 145V162" stroke="#aeb4bf" stroke-width="2" marker-end="url(#arrow)"/><text x="122" y="190" text-anchor="middle" font-family="Consolas, SFMono-Regular, monospace" font-size="14" font-weight="600" fill="#2a52a0">EVIDENCE-BOUND PATCH</text>
  </g>
  <g transform="translate(912 116)">
    <rect width="246" height="216" rx="8" fill="#ffffff" stroke="#1f7a3e" stroke-width="2"/><rect width="246" height="46" rx="8" fill="#eaf6ee"/><path d="M0 46H246" stroke="#a9d1b6"/>
    <path d="M20 23L26 29L39 16" fill="none" stroke="#1f7a3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"><text x="50" y="30" font-size="20" font-weight="600" fill="#175b2f">04 批准与验证</text><text x="22" y="82" font-size="15" fill="#6b7280">人工核对 Patch ID + SHA-256</text></g>
    <g font-family="Consolas, SFMono-Regular, monospace" font-size="14"><rect x="22" y="101" width="94" height="34" rx="4" fill="#fbecec" stroke="#e3aaaa"/><text x="69" y="123" text-anchor="middle" fill="#9e2424">BEFORE FAIL</text><rect x="130" y="101" width="94" height="34" rx="4" fill="#eaf6ee" stroke="#a9d1b6"/><text x="177" y="123" text-anchor="middle" fill="#1f7a3e">AFTER PASS</text><text x="22" y="160" fill="#15181e">restricted Docker</text><text x="22" y="188" font-weight="600" fill="#1f7a3e">SELF-CONTAINED HTML</text></g>
  </g>
  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif" font-size="14" fill="#6b7280">
    <rect x="42" y="363" width="1116" height="48" rx="5" fill="#f6f7f9" stroke="#d8dce3"/>
    <text x="62" y="393">确定性护栏：</text><text x="164" y="393" font-family="Consolas, SFMono-Regular, monospace" fill="#21417f">EVIDENCE ID</text><text x="272" y="393">·</text><text x="290" y="393" font-family="Consolas, SFMono-Regular, monospace" fill="#21417f">PATCH SHA-256</text><text x="426" y="393">·</text><text x="444" y="393">明确批准</text><text x="516" y="393">·</text><text x="534" y="393" font-family="Consolas, SFMono-Regular, monospace" fill="#21417f">NO NETWORK</text><text x="641" y="393">·</text><text x="659" y="393" font-family="Consolas, SFMono-Regular, monospace" fill="#21417f">NON-ROOT</text><text x="746" y="393">·</text><text x="764" y="393" font-family="Consolas, SFMono-Regular, monospace" fill="#21417f">READ-ONLY</text>
  </g>
</svg>
